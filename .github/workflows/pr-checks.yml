name: PR Checks

on:
  pull_request:
    branches:
      - main  # Cambia 'main' por la rama principal si es diferente

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build